services:
  - type: web
    name: ca14-tracker
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ca14-tracker-db
          property: connectionString

databases:
  - name: ca14-tracker-db
    databaseName: actracker
    user: actracker
    plan: free
    region: frankfurt
